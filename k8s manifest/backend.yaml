apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: myblog-ns
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: kevinjcloud/backend:latest
        ports:
        - containerPort: 5000
        envFrom:
        - secretRef:
            name: backend-secret
